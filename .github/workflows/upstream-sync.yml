name: Dumpstarr sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Pull Dumpstarr and TRaSH and rebuild profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild, test, and commit
        run: |
          chmod +x ./scripts/sync_upstream.sh
          ./scripts/sync_upstream.sh

      - name: Push when the tests passed
        run: |
          if [ -n "$(git log --oneline origin/v2..HEAD)" ]; then
            git push origin HEAD:v2
          else
            echo "Nothing to push."
          fi
