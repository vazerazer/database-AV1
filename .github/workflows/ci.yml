name: Tests

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

jobs:
  test:
    name: Compile and rescore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Schema version
        id: schema
        run: |
          TAG=$(python3 -c "import json; print(json.load(open('pcd.json'))['dependencies']['https://github.com/Dictionarry-Hub/schema'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout schema
        uses: actions/checkout@v4
        with:
          repository: Dictionarry-Hub/schema
          ref: ${{ steps.schema.outputs.tag }}
          path: deps/schema

      - name: Run tests
        env:
          PCD_SCHEMA_PATH: deps/schema/ops
        run: python3 tests/test_database.py
