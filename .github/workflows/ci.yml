name: PCD Audit & Simulation Battery

on:
  push:
    branches: [main, v2, dev, stable]
  pull_request:
    branches: [main, v2, dev, stable]

jobs:
  test:
    name: PCD Audit & Scoring Battery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PCD Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout Dictionarry Schema Dependency
        uses: actions/checkout@v4
        with:
          repository: 'Dictionarry-Hub/schema'
          path: 'deps/schema'

      - name: Run PCD Audit Harness
        run: |
          python3 tests/audit_pcd_harness.py .

      - name: Run Scoring Simulation Battery
        run: |
          python3 tests/simulate_scoring.py
